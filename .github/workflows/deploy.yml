name: CI/CD Pipeline & Automatic Deployment

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Permissions for GitHub Pages deployment
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 3. Install Dependencies
        run: npm ci

      - name: 4. [CI] Run Full Automated Test Suite (10,000 Fuzzing & Invariants)
        run: npm test

      - name: 5. [CI] Build Production Bundle (Vite + TypeScript)
        run: npm run build

      - name: 6. Setup Pages
        uses: actions/configure-pages@v5

      - name: 7. Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: 8. Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 9. [Backup] Sync to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}
