name: CI/CD Pipeline & Automatic Deployment

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# 赋予 GITHUB_TOKEN 写权限以实现全自动 CI/CD 发布
permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  ci-cd:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 3. Install Dependencies
        run: npm ci

      - name: 4. [CI] Run Full Automated Test Suite (10,000 Fuzzing & Invariants)
        run: npm test

      - name: 5. [CI] Build Production Bundle (Vite + TypeScript)
        run: npm run build

      - name: 6. [CD] Deploy to GitHub Pages Automatically
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}




